info:
  name: "تحديث تفضيلات الإشعارات"
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{general_url}}/notifications/preferences"
  body:
    type: json
    data: |-
      {
        "offers_enabled": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  تحديث تفضيل واحد أو أكثر لإشعارات الحساب الحالي دون تغيير التفضيلات التي لم تُرسل.

  ## المصادقة

  يتطلب Bearer token صالحًا لحساب user أو store.

  ## Body (JSON)

  - orders_enabled (boolean): اختياري. true للتفعيل أو false للإيقاف.

  - pickup_enabled (boolean): اختياري. true للتفعيل أو false للإيقاف.

  - returns_enabled (boolean): اختياري. true للتفعيل أو false للإيقاف.

  - chats_enabled (boolean): اختياري. true للتفعيل أو false للإيقاف.

  - offers_enabled (boolean): اختياري. true للتفعيل أو false للإيقاف.

  أرسل حقلًا واحدًا أو أكثر، ويجب إرسال قيمة واحدة على الأقل.

  لا توجد حقول Enum في هذا الطلب.

  ## مثال

  يرسل المثال أعلاه offers_enabled=false لإيقاف إشعارات العروض فقط.

  ## الاستجابة الناجحة

  HTTP 200 ويعيد جميع التفضيلات بعد حفظ التغيير.

  مثال مختصر: {"data":{"orders_enabled":true,"pickup_enabled":true,"returns_enabled":true,"chats_enabled":true,"offers_enabled":false}}

  ## الأخطاء

  HTTP 401 عند غياب التوكن.

  HTTP 422 عند إرسال قيمة ليست boolean أو عدم إرسال أي حقل معروف.
