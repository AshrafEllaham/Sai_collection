info:
  name: قائمة الأقسام الفرعية
  type: http
  seq: 6

http:
  method: GET
  url: "{{general_url}}/sub-categories"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: main_category_id
      value: "1"
      type: query
      description: "اختياري. معرّف قسم رئيسي نشط لتصفية الأقسام التابعة له فقط؛ احذفه لإرجاع كل الأقسام الفرعية."
    - name: pagination
      value: "off"
      type: query
      description: "اختياري. أرسل on لتفعيل تقسيم الصفحات أو off لإرجاع القائمة كاملة؛ الافتراضي off."
    - name: limit_per_page
      value: "10"
      type: query
      description: "اختياري. عدد العناصر من 1 إلى 100 عند pagination=on؛ الافتراضي 10."

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## الغرض

  جلب الأقسام الفرعية النشطة، مع إمكانية قصر النتائج على قسم رئيسي محدد.

  ## عنوان الطلب

  GET {{general_url}}/sub-categories

  قيمة general_url الحالية في المجموعة: http://127.0.0.1:8000/api

  ## المصادقة

  هذا endpoint عام ولا يتطلب تسجيل الدخول. لا يمرر الطلب مصادقة موروثة.

  ## Query parameters

  - main_category_id (اختياري): معرّف قسم رئيسي نشط. عند إرساله، تعاد الأقسام التابعة له فقط؛ احذفه لإرجاع كل الأقسام الفرعية.
  - pagination (اختياري): on لتفعيل pagination أو off لإرجاع القائمة كاملة. الافتراضي off.
  - limit_per_page (اختياري): عدد العناصر في الصفحة من 1 إلى 100 عند تفعيل pagination. الافتراضي 10.

  ## Headers

  - Accept (مطلوب): application/json.
  - Accept-Language (اختياري): ar أو en لتحديد لغة أسماء الأقسام ورسالة الرد.

  ## الاستجابة الناجحة

  HTTP 200 مع عناصر تحتوي id وparent_id وname وdescription وicon وimage.
  عند إرسال main_category_id، يطابق parent_id قيمة الفلتر.
  عند pagination=on، يضاف current_page وlast_page وtotal.

  مثال:

  {"code":200,"data":[{"id":2,"parent_id":1,"name":"ملابس رجالية","description":null,"icon":null,"image":null}],"message":"تم جلب الأقسام الفرعية بنجاح."}

  ## أخطاء التحقق

  يعيد HTTP 422 إذا لم يكن main_category_id رقمًا صحيحًا أو لم يشر إلى قسم رئيسي نشط، أو إذا كانت معاملات pagination غير صالحة.
  مثال: {"code":422,"message":"القسم الرئيسي النشط المحدد غير موجود."}
