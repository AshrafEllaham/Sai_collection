info:
  name: قائمة المحافظات
  type: http
  seq: 8

http:
  method: GET
  url: "{{general_url}}/governorates"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: country_id
      value: "1"
      type: query
      description: "اختياري. معرّف دولة نشطة لتصفية المحافظات التابعة لها فقط؛ احذفه لإرجاع كل المحافظات النشطة."
    - name: pagination
      value: "off"
      type: query
      description: "اختياري. أرسل on لتفعيل تقسيم الصفحات أو off لإرجاع القائمة كاملة؛ الافتراضي off."
    - name: limit_per_page
      value: "10"
      type: query
      description: "اختياري. عدد العناصر من 1 إلى 100 عند pagination=on؛ الافتراضي 10."

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## الغرض

  جلب المحافظات النشطة، مع إمكانية تصفيتها حسب الدولة.

  ## عنوان الطلب

  GET {{general_url}}/governorates

  قيمة general_url الحالية في المجموعة: http://127.0.0.1:8000/api

  ## المصادقة

  هذا endpoint عام ولا يتطلب تسجيل الدخول. لا يمرر الطلب مصادقة موروثة.

  ## Query parameters

  - country_id (اختياري): معرّف دولة نشطة. عند إرساله، تعاد المحافظات التابعة لها فقط؛ احذفه لإرجاع كل المحافظات النشطة.
  - pagination (اختياري): on لتفعيل pagination أو off لإرجاع القائمة كاملة. الافتراضي off.
  - limit_per_page (اختياري): عدد العناصر في الصفحة من 1 إلى 100 عند تفعيل pagination. الافتراضي 10.

  ## Headers

  - Accept (مطلوب): application/json.
  - Accept-Language (اختياري): ar أو en لتحديد لغة أسماء المحافظات ورسالة الرد.

  ## الاستجابة الناجحة

  HTTP 200 مع عناصر تحتوي id وcountry_id وname.
  عند إرسال country_id، تطابق country_id قيمة الفلتر.
  عند pagination=on، يضاف current_page وlast_page وtotal.

  مثال:

  {"code":200,"data":[{"id":1,"country_id":1,"name":"القاهرة"}],"message":"تم جلب المحافظات بنجاح."}

  ## أخطاء التحقق

  يعيد HTTP 422 إذا لم يكن country_id رقمًا صحيحًا أو لم يشر إلى دولة نشطة، أو إذا كانت معاملات pagination غير صالحة.
  مثال: {"code":422,"message":"الدولة النشطة المحددة غير موجودة."}
