info:
  name: قائمة الأقسام الرئيسية
  type: http
  seq: 5

http:
  method: GET
  url: "{{general_url}}/main-categories"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: pagination
      value: "off"
      type: query
      description: "اختياري. أرسل on لتفعيل تقسيم الصفحات أو off لإرجاع القائمة كاملة؛ الافتراضي off."
    - name: limit_per_page
      value: "10"
      type: query
      description: "اختياري. عدد العناصر من 1 إلى 100 عند pagination=on؛ الافتراضي 10."

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## الغرض

  جلب الأقسام الرئيسية النشطة فقط، وهي الأقسام التي لا تملك قسمًا أبًا.

  ## عنوان الطلب

  GET {{general_url}}/main-categories

  قيمة general_url الحالية في المجموعة: http://127.0.0.1:8000/api

  ## المصادقة

  هذا endpoint عام ولا يتطلب تسجيل الدخول. لا يمرر الطلب مصادقة موروثة.

  ## Query parameters

  - pagination (اختياري): on لتفعيل pagination أو off لإرجاع القائمة كاملة. الافتراضي off.
  - limit_per_page (اختياري): عدد العناصر في الصفحة من 1 إلى 100 عند تفعيل pagination. الافتراضي 10.

  ## Headers

  - Accept (مطلوب): application/json.
  - Accept-Language (اختياري): ar أو en لتحديد لغة أسماء الأقسام ورسالة الرد.

  ## الاستجابة الناجحة

  HTTP 200 مع عناصر تحتوي id وparent_id وname وdescription وicon وimage.
  parent_id يكون null لكل عنصر في هذه القائمة.
  عند pagination=on، يضاف current_page وlast_page وtotal.

  مثال:

  {"code":200,"data":[{"id":1,"parent_id":null,"name":"الأزياء","description":null,"icon":null,"image":null}],"message":"تم جلب الأقسام الرئيسية بنجاح."}

  ## أخطاء التحقق

  يعيد HTTP 422 إذا كانت pagination خارج on وoff أو كانت limit_per_page خارج 1 إلى 100.
  مثال: {"code":422,"message":"عدد العناصر في الصفحة يجب ألا يتجاوز 100."}
