info:
  name: قائمة المدن
  type: http
  seq: 9

http:
  method: GET
  url: "{{general_url}}/cities"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: governorate_id
      value: "1"
      type: query
      description: "اختياري. معرّف محافظة نشطة لتصفية المدن التابعة لها فقط؛ احذفه لإرجاع كل المدن النشطة."
    - name: pagination
      value: "off"
      type: query
      description: "اختياري. أرسل on لتفعيل تقسيم الصفحات أو off لإرجاع القائمة كاملة؛ الافتراضي off."
    - name: limit_per_page
      value: "10"
      type: query
      description: "اختياري. عدد العناصر من 1 إلى 100 عند pagination=on؛ الافتراضي 10."

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## الغرض

  جلب المدن النشطة، مع إمكانية تصفيتها حسب المحافظة.

  ## عنوان الطلب

  GET {{general_url}}/cities

  قيمة general_url الحالية في المجموعة: http://127.0.0.1:8000/api

  ## المصادقة

  هذا endpoint عام ولا يتطلب تسجيل الدخول. لا يمرر الطلب مصادقة موروثة.

  ## Query parameters

  - governorate_id (اختياري): معرّف محافظة نشطة. عند إرساله، تعاد المدن التابعة لها فقط؛ احذفه لإرجاع كل المدن النشطة.
  - pagination (اختياري): on لتفعيل pagination أو off لإرجاع القائمة كاملة. الافتراضي off.
  - limit_per_page (اختياري): عدد العناصر في الصفحة من 1 إلى 100 عند تفعيل pagination. الافتراضي 10.

  ## Headers

  - Accept (مطلوب): application/json.
  - Accept-Language (اختياري): ar أو en لتحديد لغة أسماء المدن ورسالة الرد.

  ## الاستجابة الناجحة

  HTTP 200 مع عناصر تحتوي id وgovernorate_id وname.
  عند إرسال governorate_id، يطابق governorate_id قيمة الفلتر.
  عند pagination=on، يضاف current_page وlast_page وtotal.

  مثال:

  {"code":200,"data":[{"id":1,"governorate_id":1,"name":"مدينة نصر"}],"message":"تم جلب المدن بنجاح."}

  ## أخطاء التحقق

  يعيد HTTP 422 إذا لم يكن governorate_id رقمًا صحيحًا أو لم يشر إلى محافظة نشطة، أو إذا كانت معاملات pagination غير صالحة.
  مثال: {"code":422,"message":"المحافظة النشطة المحددة غير موجودة."}
