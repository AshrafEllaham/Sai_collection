info:
  name: قائمة الدول
  type: http
  seq: 7

http:
  method: GET
  url: "{{general_url}}/countries"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: pagination
      value: "off"
      type: query
      description: "اختياري. أرسل on لتفعيل تقسيم الصفحات أو off لإرجاع القائمة كاملة؛ الافتراضي off."
    - name: limit_per_page
      value: "10"
      type: query
      description: "اختياري. عدد العناصر من 1 إلى 100 عند pagination=on؛ الافتراضي 10."

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## الغرض

  جلب الدول النشطة للاختيار داخل التطبيق.

  ## عنوان الطلب

  GET {{general_url}}/countries

  قيمة general_url الحالية في المجموعة: http://127.0.0.1:8000/api

  ## المصادقة

  هذا endpoint عام ولا يتطلب تسجيل الدخول. لا يمرر الطلب مصادقة موروثة.

  ## Query parameters

  - pagination (اختياري): on لتفعيل pagination أو off لإرجاع القائمة كاملة. الافتراضي off.
  - limit_per_page (اختياري): عدد العناصر في الصفحة من 1 إلى 100 عند تفعيل pagination. الافتراضي 10.

  ## Headers

  - Accept (مطلوب): application/json.
  - Accept-Language (اختياري): ar أو en لتحديد لغة أسماء الدول ورسالة الرد.

  ## الاستجابة الناجحة

  HTTP 200 مع عناصر تحتوي id وname وcode وphone_code وflag.
  عند pagination=on، يضاف current_page وlast_page وtotal.

  مثال:

  {"code":200,"data":[{"id":1,"name":"مصر","code":"EG","phone_code":"+20","flag":"🇪🇬"}],"message":"تم جلب الدول بنجاح."}

  ## أخطاء التحقق

  يعيد HTTP 422 إذا كانت pagination خارج on وoff أو كانت limit_per_page خارج 1 إلى 100.
  مثال: {"code":422,"message":"وضع تقسيم الصفحات يجب أن يكون on أو off."}
