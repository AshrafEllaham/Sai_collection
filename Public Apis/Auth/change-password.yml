info:
  name: تغيير كلمة المرور
  type: http
  seq: 7

http:
  method: PUT
  url: "{{general_url}}/change-password"
  body:
    type: json
    data: |-
      {
        "current_password": "CurrentPass123",
        "password": "NewStrongPass456",
        "password_confirmation": "NewStrongPass456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  تغيير كلمة مرور الحساب الحالي، سواء كان حساب مستخدم أو متجر.

  ## عنوان الطلب

  PUT {{general_url}}/change-password

  قيمة general_url الحالية في المجموعة: http://127.0.0.1:8000/api

  ## المصادقة

  يتطلب Bearer token صالحًا لحساب مسجل الدخول. الطلب يرث التوكن من المجموعة.

  ## Body (JSON)

  - current_password (string): مطلوب. كلمة المرور الحالية للتحقق من هوية صاحب الحساب.

  - password (string): مطلوب. كلمة المرور الجديدة، من 8 إلى 255 حرفًا، ويجب أن تختلف عن الحالية.

  - password_confirmation (string): مطلوب. يجب أن تطابق كلمة المرور الجديدة.

  لا توجد حقول Enum في هذا الطلب.

  ## الاستجابة الناجحة

  يعيد HTTP 200 مع رسالة تأكيد تغيير كلمة المرور.

  ## الأخطاء

  HTTP 401 عند غياب التوكن أو عدم صلاحيته.

  HTTP 422 عند نقص أحد الحقول أو قصر كلمة المرور الجديدة أو عدم تطابق التأكيد.

  HTTP 422 إذا كانت كلمة المرور الحالية غير صحيحة أو كانت الجديدة مطابقة للحالية.
