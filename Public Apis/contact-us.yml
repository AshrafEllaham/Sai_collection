info:
  name: إرسال رسالة تواصل
  type: http
  seq: 5

http:
  method: POST
  url: "{{general_url}}/contact-us"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Accept-Language
      value: ar
  body:
    type: json
    data: |-
      {
        "name": "أحمد محمد",
        "email": "ahmed@example.com",
        "subject": "استفسار عن التطبيق",
        "message": "أرغب في معرفة المزيد عن خدمات تطبيق سعي."
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ## الغرض

  إرسال رسالة إلى فريق سعي وحفظها في جدول contact_us.

  ## عنوان الطلب

  POST {{general_url}}/contact-us

  قيمة general_url الحالية في المجموعة: http://127.0.0.1:8000/api

  ## المصادقة

  هذا endpoint عام ولا يتطلب تسجيل الدخول.
  لا يرسل الطلب Bearer token الموروث من المجموعة.

  ## Headers

  - Accept (مطلوب): application/json.
  - Content-Type (مطلوب): application/json.
  - Accept-Language (اختياري): ar أو en لتحديد لغة رسائل التحقق.

  ## Body (JSON)

  - name (string، مطلوب): اسم المرسل، بحد أقصى 150 حرفًا.
  - email (string، مطلوب): بريد إلكتروني صالح، بحد أقصى 255 حرفًا. يُنظف ويُحوّل إلى أحرف صغيرة.
  - subject (string، مطلوب): عنوان الرسالة، بحد أقصى 255 حرفًا.
  - message (string، مطلوب): نص الرسالة من 10 إلى 5000 حرف.

  لا توجد حقول Enum في هذا الطلب.

  ## الاستجابة الناجحة

  يعيد HTTP 200 ورسالة نجاح مع معرّف الرسالة المحفوظة ووقت إنشائها.

  مثال:

  {"code":200,"data":{"id":1,"created_at":"2026-10-08T10:30:00.000Z"},"message":"تم إرسال رسالتك بنجاح."}

  ## أخطاء التحقق

  يعيد HTTP 422 مع رسالة مترجمة عند غياب حقل مطلوب، أو استخدام بريد غير صالح، أو تجاوز الأطوال المحددة.
  يجب أن يحتوي message على 10 أحرف على الأقل.
