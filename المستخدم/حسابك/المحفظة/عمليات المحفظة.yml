info:
  name: عمليات المحفظة
  type: http
  seq: 2

http:
  method: GET
  url: "{{user_ur}}/wallet?page=1&limit_per_page=10"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: page
      value: "1"
      type: query
    - name: limit_per_page
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يعرض عمليات محفظة الحساب الحالي، مرتبة من الأحدث إلى الأقدم، مع تقسيم النتائج إلى صفحات.

  ## عنوان الطلب

  GET {{general_url}}/wallet

  يستخدم الطلب متغير المجموعة general_url وقيمته الحالية http://127.0.0.1:8000/api.

  ## المصادقة

  يتطلب Bearer token صالحًا لحساب مسجل، ويرثه من إعدادات المجموعة.

  ## Headers

  Accept (مطلوب): application/json.

  Accept-Language (اختياري): ar أو en لتحديد لغة الرسالة وأخطاء التحقق.

  ## Query Parameters

  page (اختياري): رقم الصفحة، يبدأ من 1. القيمة الافتراضية 1.

  limit_per_page (اختياري): عدد العمليات في الصفحة، من 1 إلى 100. القيمة الافتراضية 10.

  الترقيم مفعّل دائمًا لهذا الطلب. يمكن استخدام next_page_url وprev_page_url من الاستجابة للانتقال بين الصفحات.

  ## الاستجابة الناجحة

  HTTP 200 مع قائمة data وبيانات current_page وlast_page وper_page وtotal وروابط الصفحات.

  كل عملية تعرض id العام، وtype، وstatus، وamount، والرصيد قبل وبعد العملية، وcurrency، وتاريخ الإنشاء والإتمام.

  نوع العملية يأتي من WalletTransactionTypeEnum: deposit للشحن، purchase للشراء، refund للاسترداد، transfer_in للتحويل الوارد، transfer_out للتحويل الصادر، withdrawal للسحب، earning للأرباح، commission للعمولة، settlement للتسوية، وad_payment لدفع إعلان.

  الحالة تأتي من WalletTransactionStatusEnum: pending معلقة، completed مكتملة، failed فاشلة، وreversed معكوسة.

  مثال مختصر: {"code":200,"message":"تم جلب عمليات المحفظة بنجاح.","data":[{"id":"d4dbf65b-88a7-4dc8-8aa5-5f6b07b0bb38","type":"deposit","status":"completed","amount":"125.50","balance_before":"0.00","balance_after":"125.50","currency":"EGP","completed_at":"2026-10-17T10:00:00+02:00","created_at":"2026-10-17T09:58:00+02:00"}],"current_page":1,"last_page":1,"per_page":10,"total":1}

  ## أخطاء مهمة

  HTTP 401 عند غياب Bearer token أو عدم صلاحيته.

  HTTP 422 إذا لم يكن page عددًا صحيحًا يبدأ من 1 على الأقل.

  HTTP 422 إذا لم يكن limit_per_page عددًا صحيحًا بين 1 و100.
