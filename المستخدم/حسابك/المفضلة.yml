info:
  name: المفضلة
  type: http
  seq: 1

http:
  method: GET
  url: "{{user_ur}}/favorites?type=product&pagination=on&limit_per_page=10&page=1"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: type
      value: product
      type: query
      description: اختياري. product لعرض المنتجات المفضلة أو store لعرض المتاجر المفضلة؛ اتركه فارغًا لعرض النوعين.
    - name: pagination
      value: "on"
      type: query
      description: اختياري. on لتقسيم النتائج إلى صفحات أو off لإرجاعها كاملة؛ الافتراضي off.
    - name: limit_per_page
      value: "10"
      type: query
      description: اختياري. عدد النتائج في الصفحة من 1 إلى 100؛ الافتراضي 10.
    - name: page
      value: "1"
      type: query
      description: اختياري. رقم الصفحة يبدأ من 1؛ الافتراضي 1.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يعرض العناصر التي أضافها المستخدم الحالي إلى المفضلة، مرتبة من الأحدث إلى الأقدم.

  ## عنوان الطلب

  GET {{user_ur}}/favorites

  قيمة user_ur في المجموعة: http://127.0.0.1:8000/api/user

  ## المصادقة

  يتطلب Bearer token صالحًا لمستخدم مسجل الدخول، ويرثه الطلب من إعدادات المجموعة.

  ## Headers

  - Accept (مطلوب): application/json.
  - Accept-Language (اختياري): ar أو en لتحديد لغة الرسالة واسم القسم.

  ## Query parameters

  - type (اختياري): product لعرض المنتجات أو store لعرض المتاجر. عند تركه دون قيمة، يعرض النوعين.
  - pagination (اختياري): on لتقسيم النتائج إلى صفحات أو off لإرجاع القائمة كاملة؛ الافتراضي off.
  - limit_per_page (اختياري): عدد النتائج في الصفحة من 1 إلى 100؛ الافتراضي 10 عند تفعيل pagination.
  - page (اختياري): رقم الصفحة كعدد صحيح يبدأ من 1؛ الافتراضي 1.

  ## الاستجابة الناجحة

  HTTP 200 مع data[].type وdata[].favoriteable_id وdata[].item.

  عنصر المنتج يعرض id وname وcategory_name وstore_name وprice وimage وaverage_rating وreviews_count.

  عنصر المتجر يعرض id وowner_id وname وimage وcover وcategory_name وaverage_rating وreviews_count.

  عند pagination=on، يضاف current_page وlast_page وper_page وtotal.

  مثال:

  {"code":200,"message":"تم جلب المفضلة بنجاح.","data":[{"id":8,"type":"product","favoriteable_id":12,"item":{"id":12,"name":"قميص قطني","category_name":"ملابس رجالية","store_name":"متجر الأزياء","price":"620.00","image":"https://example.test/storage/products/shirt.jpg","average_rating":4.7,"reviews_count":18}}],"current_page":1,"last_page":2,"per_page":10,"total":11}

  ## أخطاء التحقق

  HTTP 401 عند غياب Bearer token أو عدم صلاحيته.

  HTTP 422 إذا كانت type غير product أو store، أو كان page أقل من 1، أو كان limit_per_page خارج النطاق من 1 إلى 100.

  مثال: {"code":422,"message":"نوع المفضلة يجب أن يكون product أو store."}
