info:
  name: مسابقات المتاجر
  type: http
  seq: 2

http:
  method: GET
  url: "{{user_ur}}/competitions?status=available_now&pagination=on&limit_per_page=10&page=1"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: status
      value: available_now
      type: query
      description: اختياري. available_now يعرض المسابقات المفتوحة التي لم ينته موعدها، وended يعرض المنتهية أو المسحوب على جوائزها. حذف المعامل يعرض الحالتين.
    - name: pagination
      value: on
      type: query
      description: اختياري. on لتقسيم النتائج إلى صفحات، أو off لإرجاع كل النتائج؛ الافتراضي on.
    - name: limit_per_page
      value: "10"
      type: query
      description: اختياري. عدد النتائج في الصفحة من 1 إلى 100؛ الافتراضي 10.
    - name: page
      value: "1"
      type: query
      description: اختياري. رقم الصفحة ويبدأ من 1؛ الافتراضي 1.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يعرض مسابقات المتاجر الظاهرة للمستخدم مع التصفية حسب كونها متاحة الآن أو منتهية وتقسيم النتائج إلى صفحات.

  ## عنوان الطلب

  GET {{user_ur}}/competitions

  قيمة user_ur في المجموعة: http://127.0.0.1:8000/api/user

  ## المصادقة

  يتطلب Bearer token صالحًا لمستخدم مسجل الدخول، ويرثه الطلب من إعدادات المجموعة.

  ## Headers

  - Accept (مطلوب): application/json.
  - Accept-Language (اختياري): ar أو en لتحديد لغة رسالة الاستجابة.

  ## Query parameters

  - status (اختياري): available_now للمسابقة المفتوحة التي لم ينته موعدها، أو ended للمسابقة المنتهية أو التي تم السحب على جائزتها. عند حذفه يعرض النوعين.
  - pagination (اختياري): on لتقسيم النتائج إلى صفحات أو off لإرجاع كل النتائج؛ الافتراضي on.
  - limit_per_page (اختياري): عدد النتائج في الصفحة من 1 إلى 100؛ الافتراضي 10.
  - page (اختياري): رقم الصفحة كعدد صحيح يبدأ من 1؛ الافتراضي 1.

  ## الاستجابة الناجحة

  HTTP 200 مع data تتضمن id وpublic_id وtitle وquestion وprize وimage وstatus وends_at وstore.

  يعرض status قيمة available_now أو ended.

  يعرض store معرّف المتجر واسمه وصورته عند توفرها.

  عند pagination=on، يضاف current_page وlast_page وper_page وtotal.

  مثال:

  {"code":200,"message":"تم جلب مسابقات المتاجر بنجاح.","data":[{"id":12,"public_id":"9f8c2ad5-0e89-42c6-9ab2-1b8fb46cc400","title":"اكسب قسيمة تسوق","question":"ما هي القطعة التي تفضلها؟","prize":"قسيمة بقيمة ١٬٠٠٠ ج.م","image":"https://example.test/storage/competitions/12.jpg","status":"available_now","ends_at":"2026-10-30 09:00 AM","store":{"id":3,"name":"أزياء الشرق","image":"https://example.test/storage/stores/3.jpg"}}],"current_page":1,"last_page":2,"per_page":10,"total":13}

  ## أخطاء التحقق

  HTTP 422 إذا كانت status خارج القيم المتاحة، أو كانت page أقل من 1، أو كان limit_per_page خارج 1 إلى 100.

  HTTP 401 إذا لم يُرسل Bearer token صالح.

  القيم المسموحة لـ status:

  - available_now: مسابقات نشطة ولم يصل موعد انتهائها.
  - ended: مسابقات انتهت أو تم السحب على جوائزها.
