info:
  name: قائمة المنتجات
  type: http
  seq: 3

http:
  method: GET
  url: "{{user_ur}}/products?main_category_id=1&sub_category_id=2&search=قميص&governorate_id=1&sort=newest&pagination=on&limit_per_page=4"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: main_category_id
      value: "1"
      type: query
      description: اختياري. معرّف قسم رئيسي نشط؛ يعرض منتجاته ومنتجات أقسامه الفرعية.
    - name: sub_category_id
      value: "2"
      type: query
      description: اختياري. معرّف قسم فرعي نشط؛ عند إرسال القسم الرئيسي يجب أن يكون تابعًا له.
    - name: search
      value: قميص
      type: query
      description: اختياري. بحث جزئي باسم المنتج، حتى 120 حرفًا.
    - name: governorate_id
      value: "1"
      type: query
      description: اختياري. معرّف محافظة نشطة؛ يعرض منتجات المتاجر المسجلة فيها فقط.
    - name: sort
      value: newest
      type: query
      description: اختياري. most_purchased للأكثر شراءً، highest_rated للأعلى تقييمًا، newest للمضاف حديثًا؛ الافتراضي most_purchased.
    - name: pagination
      value: on
      type: query
      description: اختياري. on لإرجاع صفحة أو off لإرجاع النتائج كاملة؛ الافتراضي off.
    - name: limit_per_page
      value: "4"
      type: query
      description: اختياري. عدد المنتجات في الصفحة من 1 إلى 100؛ الافتراضي 10.
    - name: page
      value: "1"
      type: query
      description: اختياري. رقم الصفحة يبدأ من 1؛ الافتراضي 1.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يعرض المنتجات المنشورة والمتاحة من المتاجر النشطة، مع البحث والفلاتر والترتيب وتقسيم الصفحات.

  ## عنوان الطلب

  GET {{user_ur}}/products

  قيمة user_ur في المجموعة: http://127.0.0.1:8000/api/user

  ## المصادقة

  يتطلب Bearer token صالحًا لمستخدم مسجل الدخول، ويرثه الطلب من إعدادات المجموعة.

  ## Headers

  - Accept (مطلوب): application/json.
  - Accept-Language (اختياري): ar أو en لاختيار ترجمة اسم القسم ورسالة الاستجابة.

  ## Query parameters

  - main_category_id (اختياري): معرّف قسم رئيسي نشط؛ يعيد منتجاته ومنتجات الأقسام الفرعية التابعة له.
  - sub_category_id (اختياري): معرّف قسم فرعي نشط. إذا أرسلت main_category_id، يجب أن يكون هذا القسم الفرعي تابعًا له.
  - search (اختياري): بحث جزئي داخل اسم المنتج، بحد أقصى 120 حرفًا.
  - governorate_id (اختياري): معرّف محافظة نشطة. تظهر منتجات المتاجر التي تقع في هذه المحافظة فقط.
  - sort (اختياري): ترتيب النتائج. القيم المسموحة:
    - most_purchased: مجموع وحدات المنتجات في الطلبات المكتملة، من الأعلى إلى الأقل. وهو الترتيب الافتراضي.
    - highest_rated: متوسط التقييمات الظاهرة من الأعلى إلى الأقل؛ لا تظهر المنتجات بلا تقييم ظاهر في هذا الترتيب.
    - newest: أحدث المنتجات إضافة بحسب created_at تنازليًا، ثم id تنازليًا عند تساوي التاريخ.
  - pagination (اختياري): on لتقسيم النتائج إلى صفحات أو off لإرجاع القائمة كاملة؛ الافتراضي off.
  - limit_per_page (اختياري): عدد النتائج من 1 إلى 100 عند استخدام pagination=on؛ الافتراضي 10.
  - page (اختياري): رقم الصفحة، عدد صحيح يبدأ من 1؛ الافتراضي 1.

  ## الاستجابة الناجحة

  HTTP 200 مع قائمة data. كل منتج يعرض id وcategory_id وcategory_name وname وprice وoriginal_price وdiscount_percentage وimage وis_favorite وaverage_rating وreviews_count وunits_sold.
  عند pagination=on، يضاف current_page وlast_page وper_page وtotal.

  مثال:

  {"code":200,"message":"تم جلب المنتجات بنجاح.","data":[{"id":12,"category_id":2,"category_name":"ملابس رجالية","name":"قميص قطني","price":"620.00","original_price":null,"discount_percentage":null,"image":"https://example.test/storage/products/shirt.jpg","is_favorite":false,"average_rating":4.7,"reviews_count":18,"units_sold":187}],"current_page":1,"last_page":3,"per_page":4,"total":11}

  ## أخطاء التحقق

  HTTP 422 إذا كان sort خارج القيم المذكورة، أو كانت معرّفات الأقسام غير صحيحة أو غير نشطة، أو كان القسم الفرعي لا يتبع القسم الرئيسي، أو كانت المحافظة غير موجودة أو غير نشطة، أو تجاوز search حد 120 حرفًا.

  مثال: {"code":422,"message":"القسم الفرعي النشط المحدد غير موجود أو لا يتبع القسم الرئيسي المحدد."}
