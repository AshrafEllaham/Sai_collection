opencollection: 1.0.0

info:
  name: Sai
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: asasas
  variables:
    - name: general_url
      value: http://127.0.0.1:8000/api
    - name: user_ur
      value: http://127.0.0.1:8000/api/user
    - name: store_url
      value: http://127.0.0.1:8000/api/store
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
