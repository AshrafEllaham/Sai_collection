info:
  name: تفاصيل مسابقة المتجر
  type: http
  seq: 2

http:
  method: GET
  url: "{{store_url}}/competitions/1"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يعرض تفاصيل مسابقة يملكها المتجر الحالي.

  ## عنوان الطلب

  GET {{store_url}}/competitions/{competition}

  ## المصادقة

  يتطلب Bearer token لحساب متجر، ويرثه من إعدادات المجموعة.

  ## Path parameter

  competition: مطلوب. المعرّف الرقمي للمسابقة. غيّر 1 في URL إلى المعرّف المطلوب.

  ## Headers

  Accept: مطلوب. application/json.

  Accept-Language: اختياري. ar أو en لرسائل الرد.

  ## الاستجابة الناجحة

  HTTP 200 مع بيانات المسابقة، عدد المشاركات، ومعرّف الفائز والإجابة الصحيحة إن كانت متاحة.

  مثال مختصر: {"code":200,"data":{"id":1,"title":"مسابقة الصيف","status":"active","entries_count":8,"winner_user_id":null}}

  ## أخطاء مهمة

  HTTP 401 عند غياب التوكن أو عدم صلاحيته.

  HTTP 404 إذا لم توجد المسابقة أو لم تكن مملوكة للمتجر الحالي.
