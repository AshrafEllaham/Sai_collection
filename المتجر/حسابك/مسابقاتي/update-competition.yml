info:
  name: تعديل مسابقة متجر
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{store_url}}/competitions/1"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
    - name: Content-Type
      value: application/json
  body:
    type: multipart-form
    data:
      - name: title
        type: text
        value: "مسابقة الصيف "
      - name: question
        type: text
        value: ما اسم أول منتج أطلقه المتجر؟
      - name: prize
        type: text
        value: قسيمة شراء بقيمة 700 جنيه
      - name: image
        type: file
        value:
          - /home/nami/Pictures/Screenshots/Screenshot from 2026-09-30 22-26-09.png
        contentType: image/png
      - name: ends_at
        type: text
        value: 2026-10-10 10:05 Am
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يحدّث حقول مسابقة يملكها المتجر الحالي.

  ## عنوان الطلب

  PATCH {{store_url}}/competitions/{competition}

  ## المصادقة

  يتطلب Bearer token لحساب متجر، ويرثه من إعدادات المجموعة.

  ## Path parameter

  competition: مطلوب. المعرّف الرقمي للمسابقة. غيّر 1 في URL إلى المعرّف المطلوب.

  ## Headers

  Accept: مطلوب. application/json.

  Accept-Language: اختياري. ar أو en لرسائل الرد.

  Content-Type: مطلوب. application/json.

  ## Body (JSON)

  كل الحقول اختيارية عند التعديل، وأرسل الحقول التي تريد تغييرها فقط.

  title (string): من 2 إلى 120 حرفًا.

  question (string): من 3 إلى 5000 حرف.

  prize (string): من 1 إلى 160 حرفًا.

  image (string أو null): رابط صورة صالح لا يتجاوز 255 حرفًا، أو null لمسح الصورة.

  ends_at (date-time): موعد مستقبلي لانتهاء المشاركة.

  ## الاستجابة الناجحة

  HTTP 200 مع بيانات المسابقة بعد التحديث.

  مثال مختصر: {"code":200,"data":{"id":1,"title":"مسابقة الصيف الكبرى","status":"active"}}

  ## أخطاء مهمة

  HTTP 401 عند غياب التوكن أو عدم صلاحيته.

  HTTP 404 إذا لم توجد المسابقة أو لم تكن مملوكة للمتجر الحالي.

  HTTP 422 عند إدخال غير صالح أو موعد انتهاء غير مستقبلي.
