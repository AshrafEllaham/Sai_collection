info:
  name: تفاصيل كوبون المتجر
  type: http
  seq: 2

http:
  method: GET
  url: "{{store_url}}/coupons/1"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يعرض تفاصيل كوبون واحد مملوك للمتجر الحالي.

  ## عنوان الطلب

  GET {{store_url}}/coupons/{coupon}

  ## المصادقة

  يتطلب Bearer token لحساب متجر، ويرثه من إعدادات المجموعة.

  ## Path parameter

  coupon: مطلوب. المعرّف الرقمي للكوبون المملوك للمتجر الحالي. غيّر 1 في URL إلى المعرّف المطلوب.

  ## Headers

  Accept: مطلوب. application/json.

  Accept-Language: اختياري. ar أو en للرسائل.

  ## الاستجابة الناجحة

  HTTP 200 مع بيانات الكوبون وإحصائيات الأداء الفعلية.

  يتضمن statistics.completed_orders_count عدد الطلبات المكتملة والمدفوعة التي استخدمت الكوبون.

  يتضمن statistics.sales_amount إجمالي total_amount للطلبات المكتملة والمدفوعة.

  يتضمن statistics.discount_amount إجمالي الخصم للطلبات المكتملة والمدفوعة.

  يتضمن statistics.average_order_amount متوسط total_amount للطلبات المكتملة والمدفوعة.

  يتضمن statistics.usage_last_7_days سبعة أيام تقويمية، مع تاريخ كل يوم وعدد مرات استخدام الكوبون المسجلة فيه.

  مثال مختصر: {"code":200,"data":{"id":1,"code":"SAEY20","discount_type":"percentage","status":"active","statistics":{"completed_orders_count":2,"sales_amount":1600,"discount_amount":400,"average_order_amount":800,"usage_last_7_days":[{"date":"2026-10-05","count":0}]}}}

  ## أخطاء مهمة

  HTTP 401 عند غياب التوكن أو عدم صلاحيته.

  HTTP 404 إذا لم يوجد المعرّف أو لم يكن الكوبون مملوكًا للمتجر الحالي.
