info:
  name: إنشاء كوبون متجر
  type: http
  seq: 3

http:
  method: POST
  url: "{{store_url}}/coupons"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "code": "SAEY20",
        "discount_type": "percentage",
        "discount_value": 20,
        "minimum_order_amount": 500,
        "maximum_discount_amount": 250,
        "max_uses": 100,
        "max_uses_per_user": 1,
        "starts_at": null,
        "expires_at": "2027-12-31T23:59:59",
        "is_active": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  ينشئ كوبون خصم جديدًا مرتبطًا بمتجر الحساب الحالي.

  ## عنوان الطلب

  POST {{store_url}}/coupons

  ## المصادقة

  يتطلب Bearer token لحساب متجر، ويرثه من إعدادات المجموعة.

  ## Headers

  Accept: مطلوب. application/json.

  Accept-Language: اختياري. ar أو en للرسائل.

  Content-Type: مطلوب. application/json.

  ## Body (JSON)

  code (string، مطلوب): من 3 إلى 20 حرفًا. أحرف إنجليزية كبيرة أو أرقام أو _ أو - فقط، وفريد داخل المتجر.

  discount_type (string، مطلوب): percentage لخصم نسبة مئوية، أو fixed لخصم مبلغ ثابت.

  discount_value (number، مطلوب): أكبر من صفر. مع percentage لا تتجاوز القيمة 100.

  minimum_order_amount (number، مطلوب): صفر أو أكثر.

  maximum_discount_amount (number أو null، اختياري): سقف مبلغ الخصم، ويجب أن يكون أكبر من صفر عند إرساله.

  max_uses (integer، مطلوب): إجمالي الاستخدامات المسموح بها، 1 أو أكثر.

  max_uses_per_user (integer، مطلوب): حد الاستخدام لكل مستخدم، 1 أو أكثر ولا يتجاوز max_uses.

  starts_at (تاريخ ووقت أو null، اختياري): وقت بدء صلاحية الكوبون.

  expires_at (تاريخ ووقت، مطلوب): تاريخ مستقبلي لانتهاء الكوبون.

  is_active (boolean، اختياري): true للتفعيل، false للحفظ متوقفًا. الافتراضي true.

  ## الاستجابة الناجحة

  HTTP 200 مع الكوبون المنشأ وstatus بقيمة active أو paused.

  مثال مختصر: {"code":200,"data":{"id":1,"code":"SAEY20","discount_type":"percentage","status":"active","is_active":true}}

  ## أخطاء مهمة

  HTTP 401 عند غياب التوكن أو عدم صلاحيته.

  HTTP 422 عند نقص حقل مطلوب أو قيمة غير صالحة أو كود مكرر أو نسبة أكبر من 100.

  HTTP 422 إذا لم يكن الحساب من نوع متجر.
