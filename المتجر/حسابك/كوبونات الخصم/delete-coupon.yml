info:
  name: حذف كوبون متجر
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{store_url}}/coupons/1"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يحذف كوبونًا مملوكًا للمتجر الحالي باستخدام الحذف الناعم.

  ## عنوان الطلب

  DELETE {{store_url}}/coupons/{coupon}

  ## المصادقة

  يتطلب Bearer token لحساب متجر، ويرثه من إعدادات المجموعة.

  ## Path parameter

  coupon: مطلوب. المعرّف الرقمي للكوبون المملوك للمتجر الحالي. غيّر 1 في URL إلى المعرّف المطلوب.

  ## Headers

  Accept: مطلوب. application/json.

  Accept-Language: اختياري. ar أو en للرسائل.

  ## الاستجابة الناجحة

  HTTP 200 مع data فارغة ورسالة تؤكد الحذف.

  مثال مختصر: {"code":200,"data":null,"message":"The coupon was deleted successfully."}

  ## أخطاء مهمة

  HTTP 401 عند غياب التوكن أو عدم صلاحيته.

  HTTP 404 إذا لم يوجد الكوبون أو لم يكن مملوكًا للمتجر الحالي.
