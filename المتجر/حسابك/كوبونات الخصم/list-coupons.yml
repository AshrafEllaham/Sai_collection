info:
  name: عرض كوبونات المتجر
  type: http
  seq: 1

http:
  method: GET
  url: "{{store_url}}/coupons?pagination=on&limit_per_page=10&status=active"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: pagination
      value: on
      type: query
    - name: limit_per_page
      value: "10"
      type: query
    - name: status
      value: active
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يعرض كوبونات المتجر الحالي لملء شاشة إدارة الكوبونات.

  ## عنوان الطلب

  GET {{store_url}}/coupons

  ## المصادقة

  يتطلب Bearer token لحساب متجر، ويرثه من إعدادات المجموعة.

  ## Query parameters

  pagination: اختياري. القيمة off تعرض كل كوبونات المتجر، وهي القيمة الافتراضية. استخدم on لتفعيل الترقيم.

  page: اختياري مع الترقيم. رقم الصفحة، ويبدأ من 1.

  limit_per_page: اختياري مع الترقيم. من 1 إلى 100، والافتراضي 10.

  status: اختياري. active للكوبونات النشطة، وinactive للمتوقفة (حالتها المخزنة paused)، وexpired للمنتهية أو التي تجاوزت تاريخ الانتهاء.

  search: اختياري. بحث جزئي بكود الكوبون، حتى 32 حرفًا.

  ## الاستجابة الناجحة

  HTTP 200 مع عناصر الكوبونات داخل data، وتشمل كل كوبون وحالته وحدود استخدامه.

  يتضمن summary.active_coupons_count عدد الكوبونات النشطة في المتجر.

  يتضمن summary.total_uses_count إجمالي مرات الاستخدام في كل كوبونات المتجر، حتى عند استخدام status filter.

  عند إرسال pagination=on تتضمن الاستجابة current_page وper_page وtotal وlast_page لمعلومات الترقيم.

  مثال مختصر: {"code":200,"summary":{"active_coupons_count":1,"total_uses_count":12},"data":[{"id":1,"code":"SAEY20","discount_type":"percentage","status":"active","is_active":true}]}

  ## أخطاء مهمة

  HTTP 401 عند غياب التوكن أو عدم صلاحيته.

  HTTP 422 عند إرسال حالة أو ترقيم أو بحث غير صالح.

  قيم status المقبولة: active أو inactive أو expired.

  HTTP 422 إذا لم يكن الحساب من نوع متجر.
