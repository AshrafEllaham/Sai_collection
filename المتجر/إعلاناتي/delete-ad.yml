info:
  name: حذف إعلان
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{store_url}}/ads/1"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يحذف الإعلان حذفًا ناعمًا من حساب المتجر الحالي.

  ## عنوان الطلب

  DELETE {{store_url}}/ads/{ad}

  ## المصادقة

  يتطلب Bearer token صالحًا لحساب من نوع store، ويرثه من إعدادات المجموعة.

  ## Path parameters

  ad: مطلوب. المعرّف الرقمي للإعلان المملوك للمتجر الحالي.

  ## الاستجابة الناجحة

  HTTP 200 مع data=null ورسالة نجاح.

  ## أخطاء مهمة

  HTTP 401 عند غياب التوكن أو عدم صلاحيته.

  HTTP 404 عندما لا يكون الإعلان موجودًا أو لا يخص المتجر الحالي.
