info:
  name: قائمة إعلانات المتجر
  type: http
  seq: 1

http:
  method: GET
  url: "{{store_url}}/ads?pagination=on&limit_per_page=10"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: pagination
      value: on
      type: query
    - name: limit_per_page
      value: "10"
      type: query
      description: اختياري. عدد الإعلانات في الصفحة من 1 إلى 100.
    - name: status
      value: draft
      type: query
      description: اختياري. إحدى قيم حالة الإعلان الموضحة في docs.
      disabled: true
    - name: placement
      value: home
      type: query
      description: اختياري. إحدى قيم موضع الإعلان الموضحة في docs.
      disabled: true
    - name: search
      value: الصيف
      type: query
      description: اختياري. بحث جزئي في عنوان الإعلان حتى 120 حرفًا.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يعرض إعلانات حساب المتجر الحالي مع تقسيم النتائج إلى صفحات وفلاتر اختيارية.

  ## عنوان الطلب

  GET {{store_url}}/ads

  ## المصادقة

  يتطلب Bearer token صالحًا لحساب من نوع store، ويرثه من إعدادات المجموعة.

  ## Query parameters

  page: اختياري. رقم صحيح يبدأ من 1؛ الافتراضي 1.

  limit_per_page: اختياري. عدد صحيح من 1 إلى 100؛ الافتراضي حسب إعدادات pagination.

  status: اختياري. draft للمسودة، pending_review قيد المراجعة، scheduled مجدول، active نشط، paused موقوف، completed مكتمل، rejected مرفوض.

  placement: اختياري. home للصفحة الرئيسية، category لصفحة القسم، storefront لواجهة المتجر.

  search: اختياري. بحث جزئي في عنوان الإعلان، بحد أقصى 120 حرفًا.

  ## Headers

  Accept: مطلوب. application/json.

  Accept-Language: اختياري. ar أو en للغة رسائل الاستجابة.

  ## الاستجابة الناجحة

  HTTP 200 مع قائمة إعلانات المتجر الحالي وبيانات pagination.

  مثال: {"code":200,"data":[{"id":7,"title":"عرض الصيف","status":"draft","placement":"home","cost":"350.00","currency":"EGP"}],"current_page":1,"last_page":1,"per_page":10,"total":1}

  ## أخطاء مهمة

  HTTP 401 عند غياب التوكن أو عدم صلاحيته.

  HTTP 422 عند استخدام حالة أو موضع غير مسموح، أو قيم pagination خارج القيود، أو إذا لم يكن الحساب متجرًا.
