info:
  name: باقات الإعلانات النشطة
  type: http
  seq: 6

http:
  method: GET
  url: "{{store_url}}/ad-packages"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  يجلب باقات الإعلان النشطة التي يمكن للمتجر اختيارها عند إنشاء إعلان أو تعديله.

  ## عنوان الطلب

  GET {{store_url}}/ad-packages

  ## المصادقة

  يتطلب Bearer token صالحًا لحساب من نوع store، ويرثه من إعدادات المجموعة.

  ## Headers

  Accept: مطلوب. application/json.

  Accept-Language: اختياري. ar أو en لتحديد لغة اسم الباقة.

  ## الاستجابة الناجحة

  HTTP 200 مع id وcode وname وdescription وduration_days وprice وcurrency لكل باقة نشطة.

  مثال: {"code":200,"data":[{"id":1,"code":"weekly","name":"ظهور مميز","duration_days":7,"price":"350.00","currency":"EGP"}]}

  ## أخطاء مهمة

  HTTP 401 عند غياب التوكن أو عدم صلاحيته.

  HTTP 422 إذا لم يكن الحساب من نوع store.
