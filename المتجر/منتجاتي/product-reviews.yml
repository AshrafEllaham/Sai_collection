info:
  name: تقييمات المنتج
  type: http
  seq: 7

http:
  method: GET
  url: "{{store_url}}/products/1/reviews"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  params:
    - name: page
      value: "1"
      type: query
      description: اختياري. رقم الصفحة ويبدأ من 1؛ الافتراضي 1.
    - name: limit_per_page
      value: "10"
      type: query
      description: اختياري. عدد التقييمات في الصفحة من 1 إلى 100؛ الافتراضي 10.
    - name: rating
      value: "5"
      type: query
      description: اختياري. تصفية حسب عدد النجوم كعدد صحيح من 1 إلى 5.
    - name: period
      value: all
      type: query
      description: اختياري. الفترة all أو month أو week؛ الافتراضي all.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ## الغرض

  جلب التقييمات الظاهرة لمنتج مملوك للمتجر الحالي، مع تقسيم النتائج إلى صفحات وملخص خاص بالمنتج.

  ## عنوان الطلب

  GET {{store_url}}/products/{{product_id}}/reviews

  يستخدم العنوان الأساسي store_url المعرّف في المجموعة.

  استبدل 1 في عنوان الطلب بمعرّف المنتج المطلوب.

  ## Path parameter

  product_id: مطلوب. معرّف رقمي لمنتج مملوك لحساب المتجر الحالي.

  ## المصادقة

  يتطلب Bearer token صالحًا لحساب من نوع store، ويرثه الطلب من إعدادات المجموعة.

  ## Query parameters

  page: اختياري. رقم الصفحة كعدد صحيح يبدأ من 1؛ الافتراضي 1.

  limit_per_page: اختياري. عدد التقييمات في الصفحة، من 1 إلى 100؛ الافتراضي 10. التقسيم مفعّل دائمًا.

  rating: اختياري. تصفية التقييمات حسب عدد النجوم كعدد صحيح بين 1 و5.

  period: اختياري. all لعرض كل الفترات، month لآخر 30 يومًا، أو week لبداية الأسبوع الحالي وحتى الآن. الافتراضي all.

  ## Headers

  Accept: مطلوب. القيمة application/json.

  Accept-Language: اختياري. ar أو en لتحديد لغة رسالة الاستجابة.

  ## Body

  لا يتطلب هذا الطلب body.

  ## الاستجابة الناجحة

  HTTP 200. تحتوي data على صفحة تقييمات المنتج، مع حقول current_page وlast_page وper_page وtotal.

  كل عنصر يعرض rating وcomment وcreated_at وبيانات customer وproduct المحملة مسبقًا.

  summary خاص بالمنتج ومستقل عن الفلاتر والصفحة الحالية، ويعرض total_reviews وaverage_rating وتوزيع rating_distribution ونسبة customer_satisfaction_percentage وعدد new_this_month_count.

  customer_satisfaction_percentage هي نسبة التقييمات الظاهرة ذات 4 أو 5 نجوم من إجمالي التقييمات الظاهرة.

  مثال مختصر:

  {"code":200,"message":"تم جلب تقييمات المتجر بنجاح.","summary":{"total_reviews":86,"average_rating":4.8,"rating_distribution":[{"rating":1,"total":0},{"rating":2,"total":2},{"rating":3,"total":3},{"rating":4,"total":10},{"rating":5,"total":71}],"customer_satisfaction_percentage":94,"new_this_month_count":12},"data":[{"id":12,"rating":5,"comment":"منتج ممتاز.","created_at":"2026-10-09T10:00:00.000000Z","customer":{"id":5,"name":"سارة أحمد"},"product":{"id":4,"name":"جاكيت جلد طبيعي"}}],"current_page":1,"last_page":9,"per_page":10,"total":86}

  ## أخطاء مهمة

  HTTP 401 عند غياب التوكن أو عدم صلاحيته.

  HTTP 404 إذا لم يوجد المنتج أو لم يكن مملوكًا لحساب المتجر الحالي.

  HTTP 422 إذا لم يكن الحساب من نوع store، أو إذا كان rating خارج 1 إلى 5، أو period خارج all وmonth وweek.
